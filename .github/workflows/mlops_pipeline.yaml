name: Credit Risk MLOps Pipeline (CI/CD)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality-assurance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # Atualizado para v4

      - name: Configurar Python 3.13
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
          cache: 'pip' # RESOLVE: Cache automático de dependências

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest pytest-mock

      - name: Linting (Flake8)
        run: flake8 src/ production_app/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Testes Automatizados (Pytest)
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          pytest tests/ --no-header -v

  docker-build-secure:
    needs: quality-assurance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and Load (Local Test)
        uses: docker/build-push-action@v4
        with:
          context: .
          load: true
          tags: credit-risk-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@masteraju
        with:
          image-ref: 'credit-risk-app:latest'
          format: 'table'
          exit-code: '0' # Não quebra o build acadêmico, mas gera o relatório
          severity: 'CRITICAL,HIGH'

      - name: Deploy Simulation
        run: echo "🚀 Imagem validada e pronta para o Container Registry."