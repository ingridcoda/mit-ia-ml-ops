quality:
  suite_name: "credit_quality_suite"
  fail_pipeline_on_error: true
  output_dir: "outputs/quality"

table_expectations:
  - type: expect_table_row_count_to_be_between
    kwargs:
      min_value: 500
      max_value: 2000

column_expectations:
  Risk:
    - type: expect_column_values_to_be_in_set
      kwargs:
        value_set: [ "good", "bad" ]
  Age:
    - type: expect_column_values_to_be_between
      kwargs:
        min_value: 18
        max_value: 100
  Credit amount:
    - type: expect_column_values_to_be_between
      kwargs:
        min_value: 1