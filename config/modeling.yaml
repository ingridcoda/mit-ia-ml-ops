# ── Configuração de Classificação ─────────────────────────────────────────────
target_column: "Risk"
test_size: 0.2
random_state: 42

# ── Estratégia de MLOps ───────────────────────────────────────────────────────
tracking_uri: "sqlite:///mlruns.db"
experiment_name: "Credit_Risk_Classification"

# ── Configuração do Pipeline Final ────────────────────────────────────────────
best_model:
  module: "xgboost"
  class: "XGBClassifier"
  default_params:
    n_estimators: 100
    learning_rate: 0.1
    max_depth: 5
    random_state: 42
    eval_metric: "logloss"

pipeline_params:
  scaling:
    # Colunas numéricas que precisam passar pelo ZScore/StandardScaler
    columns: [ "Age", "Duration", "Credit amount", "log_Credit amount" ]

# Atendendo à Parte 4 da Rubrica: Redução de Dimensionalidade
feature_reduction:
  strategy: "pca"
  n_components: 0.95

# ── Otimização (Maximizar F1 para detectar calotes) ──────────────────────────
optimizer:
  strategy: "optuna"
  metric: "f1" # Mudança para classificação
  direction: "maximize"
  optuna:
    default_trials: 20

# ── Modelos (Classificadores) ────────────────────────────────────────────────
models_to_run:
  - "random_forest"
  - "xgboost"

models:
  random_forest:
    module: "sklearn.ensemble"
    class: "RandomForestClassifier"
    default_params:
      n_estimators: 100
      class_weight: "balanced"
    search_space:
      n_estimators:
        type: "int"
        low: 50
        high: 300
      max_depth:
        type: "int"
        low: 3
        high: 15

xgboost:
  module: "xgboost"
  class: "XGBClassifier"
  default_params:
    eval_metric: "logloss"
  search_space:
    learning_rate:
      type: "float"
      low: 0.01
      high: 0.2
    # Adicionando controle de profundidade para evitar Overfitting
    max_depth:
      type: "int"
      low: 2
      high: 4
    # Adicionando regularização (Gamma)
    gamma:
      type: "float"
      low: 0.0
      high: 5.0

# ── Ensembles (Parte 3 da Rubrica) ───────────────────────────────────────────
ensembles:
  top_n_base_models: 2
  voting:
    enabled: true
    voting_type: "soft" # Usa probabilidades

# ── Artefatos Diagnósticos (Parte 5 da Rubrica) ──────────────────────────────
artifacts:
  output_dir: "outputs/modeling"
  plots:
    - "confusion_matrix"   # Crucial para Risco de Crédito
    - "roc_auc_curve"
    - "feature_importance"
    - "learning_curve"